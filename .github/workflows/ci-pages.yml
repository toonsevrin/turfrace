name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded branch builds, but never interrupt an in-progress Pages deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: Check, lint, and test
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install Bevy system dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libx11-dev libwayland-dev libasound2-dev libudev-dev libxkbcommon-x11-0
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Run repository checks
        run: ./scripts/feedback

  build-pages:
    name: Build web release
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Install Trunk
        uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: v0.21.14
      - name: Build deployable site
        run: ./scripts/build-web --public-url "${{ steps.pages.outputs.base_path }}/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
