[package]
name = "turfrace"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "3d",
    "ui",
    "audio",
] }
earcutr = "0.5.0"
i_overlay = { version = "7.0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Storage",
    "Window",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
