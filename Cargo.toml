[package]
name = "turfrace"
version = "0.1.0"
edition = "2024"

[features]
default = ["shell"]
# The simulation builds without windowing, devices, rendering, or audio.
# Custom flat materials need PBR's material pipeline, not the 3d umbrella's
# glTF, morph targets, post-processing, anti-alias plugins, or texture LUTs.
shell = ["bevy/bevy_pbr", "bevy/ui", "bevy/audio"]

[[bin]]
name = "turfrace"
path = "src/main.rs"
required-features = ["shell"]

[[example]]
name = "visual_playtest"
required-features = ["shell"]

[[example]]
name = "territory_review"
required-features = ["shell"]

[[example]]
name = "performance_benchmark"
required-features = ["shell"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["std", "async_executor"] }
earcutr = "0.5.0"
i_overlay = { version = "7.0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Storage",
    "Window",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
