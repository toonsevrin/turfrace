<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3f5" />
    <meta name="description" content="Turfrace — a local multiplayer territory game" />
    <link rel="icon" href="data:," />
    <title>Turfrace</title>
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="css" href="web/styles.css" />
    <!-- Rust's release profile performs the WASM optimization. Keep Trunk's
         wasm-opt pass disabled because its bundled validator does not accept
         the bulk-memory and non-trapping-float operations emitted here. -->
    <link data-trunk rel="rust" data-wasm-opt="0" />
  </head>
  <body>
    <main id="game-shell" aria-label="Turfrace game">
      <div id="loading" role="status">
        <div class="logo" aria-label="Turfrace">TURFRACE</div>
        <div class="track"><span></span></div>
        <p>Preparing the turf…</p>
      </div>
    </main>
    <noscript>Turfrace needs JavaScript and WebGL2 enabled.</noscript>
    <script>
      const shell = document.querySelector("#game-shell");
      const loading = document.querySelector("#loading");
      const canvasObserver = new MutationObserver(() => {
        const canvas = document.querySelector("canvas");
        if (canvas) {
          if (canvas.parentElement !== shell) shell.appendChild(canvas);
          loading.classList.add("hidden");
          canvas.addEventListener("contextmenu", event => event.preventDefault());
          canvasObserver.disconnect();
        }
      });
      canvasObserver.observe(document.body, { childList: true, subtree: true });

      window.addEventListener("error", event => {
        loading.classList.remove("hidden");
        loading.querySelector("p").textContent =
          "Turfrace could not start. Check that WebGL2 is enabled and reload.";
        console.error(event.error || event.message);
      });
    </script>
  </body>
</html>
